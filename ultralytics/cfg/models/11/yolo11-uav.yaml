# YOLO11 UAV small-object detector with P2 head, frequency-aware downsampling/fusion,
# lightweight semantic alignment, and small-object weighted Inner-SIoU regression.
# Usage: yolo detect train model=ultralytics/cfg/models/11/yolo11s-uav.yaml data=...

nc: 80
inner_iou_ratio: 0.7
small_box_gain: 0.5
small_box_scale: 32.0

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-C2
  - [-1, 1, FrequencyFocusedDownsample, [256]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-C3
  - [-1, 1, FrequencyFocusedDownsample, [512]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-C4
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 10-C5

head:
  # Top-down frequency-enhanced path.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, LightweightAlignedConcat, []]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, FrequencyEnhancedFusion, [512]] # 14-P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, LightweightAlignedConcat, []]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, FrequencyEnhancedFusion, [256]] # 18-P3 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, LightweightAlignedConcat, []]
  - [-1, 2, C3k2, [128, False]]
  - [-1, 1, FrequencyEnhancedFusion, [128]] # 22-P2/4

  # Bottom-up path, retaining P2 while rebuilding P3-P5.
  - [-1, 1, FrequencyFocusedDownsample, [256]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, FrequencyEnhancedFusion, [256]] # 26-P3/8

  - [-1, 1, FrequencyFocusedDownsample, [512]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, FrequencyEnhancedFusion, [512]] # 30-P4/16

  - [-1, 1, Conv, [1024, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, FrequencyEnhancedFusion, [1024]] # 34-P5/32

  - [[22, 26, 30, 34], 1, UAVDetect, [nc]] # Detect(P2, P3, P4, P5)
