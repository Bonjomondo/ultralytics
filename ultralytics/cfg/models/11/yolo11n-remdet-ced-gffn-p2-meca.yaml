# YOLO11n + CED + GatedFFN + P2 head + MECA attention on detection features.
# Ablation target: test whether MFR-style coordinate attention is worth the cost.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, GatedFFN, [256, True, 1, 3]]
  - [-1, 1, CED, [256, 0.5]] # 3-P3/8
  - [-1, 2, GatedFFN, [512, True, 1, 3]]
  - [-1, 1, CED, [512, 0.5]] # 5-P4/16
  - [-1, 2, GatedFFN, [512, True, 1, 3]]
  - [-1, 1, CED, [1024, 0.5]] # 7-P5/32
  - [-1, 2, GatedFFN, [1024, True, 1, 3]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]
  - [-1, 1, MECA, [128, 32, [3, 5], True]] # 20-P2/4

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, MECA, [256, 32, [3, 5], True]] # 24-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, MECA, [512, 32, [3, 5], True]] # 28-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, MECA, [1024, 32, [3, 5], True]] # 32-P5/32

  - [[20, 24, 28, 32], 1, Detect, [nc]]
