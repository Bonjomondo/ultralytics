# YOLO11n + CED + GatedFFN + lightweight P2 detection head.
# Ablation target: test whether a P2/4 output improves distant tiny-object recall.

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, GatedFFN, [256, True, 1, 3]]
  - [-1, 1, CED, [256, 0.5]] # 3-P3/8
  - [-1, 2, GatedFFN, [512, True, 1, 3]]
  - [-1, 1, CED, [512, 0.5]] # 5-P4/16
  - [-1, 2, GatedFFN, [512, True, 1, 3]]
  - [-1, 1, CED, [1024, 0.5]] # 7-P5/32
  - [-1, 2, GatedFFN, [1024, True, 1, 3]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]] # 19-P2/4

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 22-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 25-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 28-P5/32

  - [[19, 22, 25, 28], 1, Detect, [nc]]
