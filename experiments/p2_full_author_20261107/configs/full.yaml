# Reconstructed RT-DETR-R18 baseline in the SO-DETR author's original engine.
# ResNet18-vd, vanilla P3/P4/P5 encoder, 300 queries, 3 decoder layers.
nc: 10
scales:
  l: [1.0, 1.0, 1024]
backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, null, false, relu]]
  - [-1, 1, ConvNormLayer, [32, 3, 1, null, false, relu]]
  - [-1, 1, ConvNormLayer, [64, 3, 1, null, false, relu]]
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, relu]]
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, relu]]
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, relu]]
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, relu]]
head:
  - [-1, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [6, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [5, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]  # 20 P3 lateral
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [4, 1, Conv, [128, 1, 1]]  # 22 backbone P2 projection
  - [[21, 22], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # 24 P2 output, stride4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[25, 20], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # 27 P3 output
  - [-1, 1, Conv, [256, 3, 2]]
  - [[28, 15], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # 30 P4 output
  - [-1, 1, Conv, [256, 3, 2]]
  - [[31, 10], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # 33 P5 output
  - [[24, 27, 30, 33], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
