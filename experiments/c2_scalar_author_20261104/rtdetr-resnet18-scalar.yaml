# C2 P2-to-P3 fusion, migrated to the same engine as the 27.77 AP baseline.
# Layer 17: P2/4 -> 128 channels at P3/8 by 3x3 stride-2 Conv.
# Layer 18: [upsampled P4, downsampled P2, original P3] -> 512 channels.
nc: 10
scales:
  l: [1.0, 1.0, 1024]
backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, null, false, relu]]
  - [-1, 1, ConvNormLayer, [32, 3, 1, null, false, relu]]
  - [-1, 1, ConvNormLayer, [64, 3, 1, null, false, relu]]
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, relu]]
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, relu]]
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, relu]]
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, relu]]
head:
  - [-1, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [6, 1, Conv, [256, 1, 1, null, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [4, 1, Conv, [128, 3, 2]]
  - [[16, 17, 5], 1, ScalarP2Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
